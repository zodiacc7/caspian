name: Apply upstream SOCKS5 implementation
on: push

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply core patch
        run: python3 scripts/apply_upstream_socks5_v5.py
      - name: Restore planner and request field
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          p = Path("internal/privsvc/plans.go")
          s = urlopen("https://raw.githubusercontent.com/Iman/caspian/main/internal/privsvc/plans.go", timeout=30).read().decode()
          marker = "\to.DNS.Intercept = true\n"
          block = '''\to.DNS.Intercept = true

          \to.Upstream = xcfg.UpstreamSOCKS5{
          \t\tEnabled: req.Upstream.Enabled,
          \t\tHost: req.Upstream.Host,
          \t\tPort: req.Upstream.Port,
          \t\tUsername: req.Upstream.Username,
          \t\tPassword: req.Upstream.Password,
          \t}
          '''
          if marker not in s:
              raise SystemExit("plans marker not found")
          p.write_text(s.replace(marker, block, 1))
          priv = Path("internal/panel/priv.go")
          s = priv.read_text()
          if "type UpstreamProxySpec struct" not in s:
              marker = "type StartRequest struct {\n"
              addition = '''type UpstreamProxySpec struct {
          \tEnabled bool
          \tHost string
          \tPort uint16
          \tUsername string
          \tPassword string
          }

          type StartRequest struct {
          '''
              if marker not in s:
                  raise SystemExit("StartRequest marker not found")
              s = s.replace(marker, addition, 1)
              s = s.replace("type StartRequest struct {\n", "type StartRequest struct {\n\tUpstream UpstreamProxySpec\n", 1)
              priv.write_text(s)
          PY
      - name: Apply state and panel
        run: python3 scripts/apply_upstream_panel.py
      - name: Localize upstream panel
        run: python3 scripts/fix_upstream_panel_i18n.py
      - name: Format
        run: gofmt -w internal/state/state.go internal/state/migrate.go internal/xcfg/options.go internal/xcfg/build.go internal/privsvc/plans.go internal/panel/priv.go internal/panel/handlers.go internal/panel/view.go internal/panel/i18n.go internal/panel/i18n_messages.go
      - name: Update panel goldens
        run: bash scripts/golden-update.sh
      - name: Test
        run: go test ./internal/state ./internal/xcfg ./internal/privsvc ./internal/panel
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/state internal/xcfg internal/privsvc internal/panel scripts .github/workflows/apply-upstream-socks5.yml
          git commit -m "feat: add upstream SOCKS5 settings to panel"
          git push
