name: Apply upstream SOCKS5 implementation
on: push

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply core patch
        run: python3 scripts/apply_upstream_socks5_v5.py
      - name: Restore planner and request field
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          p = Path("internal/privsvc/plans.go")
          s = urlopen("https://raw.githubusercontent.com/Iman/caspian/main/internal/privsvc/plans.go", timeout=30).read().decode()
          marker = "\to.DNS.Intercept = true\n"
          block = '''\to.DNS.Intercept = true

          \to.Upstream = xcfg.UpstreamSOCKS5{
          \t\tEnabled: req.Upstream.Enabled,
          \t\tHost: req.Upstream.Host,
          \t\tPort: req.Upstream.Port,
          \t\tUsername: req.Upstream.Username,
          \t\tPassword: req.Upstream.Password,
          \t}
          '''
          if marker not in s:
              raise SystemExit("plans marker not found")
          p.write_text(s.replace(marker, block, 1))
          PY
      - name: Apply upstream loop safety
        run: python3 scripts/apply_upstream_loop_safety.py
      - name: Format
        run: gofmt -w internal/state/state.go internal/state/migrate.go internal/xcfg/options.go internal/xcfg/build.go internal/xcfg/build_test.go internal/privsvc/plans.go internal/panel/priv.go internal/panel/handlers.go internal/panel/view.go internal/panel/i18n.go internal/panel/i18n_messages.go
      - name: Test
        run: go test ./internal/state ./internal/xcfg ./internal/privsvc ./internal/panel
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/state internal/xcfg internal/privsvc internal/panel scripts .github/workflows/apply-upstream-socks5.yml
          git commit -m "test: add upstream SOCKS5 loop safety"
          git push
