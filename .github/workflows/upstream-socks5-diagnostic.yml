name: Upstream SOCKS5 diagnostic

on:
  push:
    branches:
      - fix/upstream-socks5-ci-20260919

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          files="$(git ls-files -co --exclude-standard -z -- '*.go' | xargs -0 gofmt -l)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: panel goldens
        run: go test ./internal/panel -count=1 -run 'Golden' -v
      - name: xcfg coverage
        run: |
          go test ./internal/xcfg -count=1 -coverprofile=xcfg.cover
          go tool cover -func=xcfg.cover | tee xcfg-cover.txt
          echo '=== lowest-covered functions ==='
          awk 'NR > 1 && $3 ~ /%$/ && $3 != "100.0%" {print}' xcfg-cover.txt | sort -k3,3n | head -40
          echo '=== zero-count coverage blocks ==='
          awk 'NR > 1 && $NF == 0 {print}' xcfg.cover | head -120
